name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          bash -n ensure-ci-db.sh
          bash -n container-runtime.sh
          test -x ensure-ci-db.sh
          test -x container-runtime.sh
      - name: Unit tests
        run: bash tests/test-ensure-ci-db.sh

  dogfood:
    name: Dogfood action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pg_isready
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - uses: ./
        with:
          database: dogfood
          user: dogfood
          password: dogfood
      - name: Probe
        run: pg_isready -h localhost -p 5433 -U dogfood
      - uses: ./
        if: always()
        with:
          cleanup: true

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [unit, dogfood]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] \
             || [ "${{ needs.dogfood.result }}" != "success" ]; then
            echo "A required job did not succeed (unit=${{ needs.unit.result }}, dogfood=${{ needs.dogfood.result }})"
            exit 1
          fi
          echo "All required jobs succeeded."
