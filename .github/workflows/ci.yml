name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Refuse the organisation's private terms (the DATA_LEAK_DENYLIST secret) in this event's commits:
  # added lines, file paths, commit messages and authors.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: kilotronic/data-leak-check@f1da8a7ce76bfaabd70ea815d9417fb691e95799 # v1.1.0
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}

  # Secrets in this event's commits: gitleaks (anything shaped like a secret) and trufflehog (keys that still
  # work), from kilotronic/secret-scan.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: kilotronic/secret-scan@2665d6f2f0260d3ae0defbedcce27fc63ad6a168 # v1.2.1

  # Shell scripts (shellcheck), workflows (actionlint), and actions and base images pinned by commit and
  # digest, from kilotronic/lint.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: kilotronic/lint@50d58c6fc3916432a60d6caf5914d5bb83a60a16 # v1.1.0

  # Real authors on this event's commits, in the owner's domains, from kilotronic/git-identity.
  git-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: kilotronic/git-identity@5a7b91c3194870cf535ba8c37a6c93b19b5a933b # v2.3.1
        with:
          domains: ixid.net, kilotronic.com

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Syntax
        run: |
          bash -n ensure-ci-db.sh
          bash -n container-runtime.sh
          test -x ensure-ci-db.sh
          test -x container-runtime.sh
      - name: Unit tests
        run: bash tests/test-ensure-ci-db.sh
      - name: Decisions for each state of the port (mock runtime)
        run: bash tests/test-decisions.sh

  dogfood:
    name: Dogfood action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pg_isready
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - uses: ./
        with:
          database: dogfood
          user: dogfood
          password: dogfood
      - name: Probe
        run: pg_isready -h localhost -p 5433 -U dogfood
      - uses: ./
        if: always()
        with:
          cleanup: true

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [unit, dogfood, secret-scan, lint, git-identity, data-leak-check]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] \
             || [ "${{ needs.secret-scan.result }}" != "success" ] \
             || [ "${{ needs.lint.result }}" != "success" ] \
             || [ "${{ needs.git-identity.result }}" != "success" ] \
             || [ "${{ needs.dogfood.result }}" != "success" ] \
             || [ "${{ needs.data-leak-check.result }}" != "success" ]; then
            echo "A required job did not succeed (unit=${{ needs.unit.result }}, secret-scan=${{ needs.secret-scan.result }}, lint=${{ needs.lint.result }}, git-identity=${{ needs.git-identity.result }}, dogfood=${{ needs.dogfood.result }}, data-leak-check=${{ needs.data-leak-check.result }})"
            exit 1
          fi
          echo "All required jobs succeeded."
